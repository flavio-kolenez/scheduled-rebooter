; ============================================================================
; WatchDog DBAccess - Arquivo de configuracao
; ============================================================================
; Toda a configuracao da aplicacao e feita exclusivamente por este arquivo.
; Nao e necessario alterar codigo para ajustar caminhos, tempos, servicos,
; notificacoes ou regras de deteccao de erro.
; ============================================================================

[general]
; Nome do ambiente monitorado. Usado nas notificacoes/historico e para
; selecionar overrides na secao [environment:<NOME>] abaixo.
environment = PRODUCTION

; Nome do servidor exibido nas notificacoes. Se vazio, usa o hostname da maquina.
server_name =

; Modo Simulacao: quando "true", nenhuma acao de recuperacao real e executada
; (servicos nao sao parados/iniciados). Util para validar regras e notificacoes.
simulate_mode = false


[monitor]
; Caminho completo do console.log do DBAccess a ser monitorado.
console_log_path = C:\Protheus\dbaccess\console.log

; Quantidade de linhas mais recentes do log analisadas a cada verificacao.
lines_to_analyze = 200

; Intervalo (em segundos) recomendado entre execucoes, caso o agendamento
; externo (Agendador de Tarefas) precise seguir esse valor como referencia.
check_interval_seconds = 30

; Tempo (em segundos) aguardado antes de reler o log e confirmar se o erro
; identificado ainda esta presente, evitando falsos positivos.
error_confirmation_seconds = 10

; Intervalo minimo (em segundos) entre duas recuperacoes automaticas da
; mesma regra, evitando reinicializacoes repetidas em sequencia.
min_recovery_interval_seconds = 600


[services]
; Tempo de espera (em segundos) entre a parada e a inicializacao dos servicos
; durante uma recuperacao (ex.: aguardar apos parar o DBAccess antes de iniciar).
service_stop_wait_seconds = 5

; Nome exato do servico Windows do DBAccess.
dbaccess_service = TOTVS DBAccess

; Lista dos servicos Schedule, em ordem de DESLIGAMENTO (do ultimo indice ao Broker).
; A inicializacao usa automaticamente a ordem inversa desta lista.
schedule_services =
    02 - Totvs Protheus Schedule 8,
    02 - Totvs Protheus Schedule 7,
    02 - Totvs Protheus Schedule 6,
    02 - Totvs Protheus Schedule 5,
    02 - Totvs Protheus Schedule 4,
    02 - Totvs Protheus Schedule 3,
    02 - Totvs Protheus Schedule 2,
    02 - Totvs Protheus Schedule 1,
    02 - TOTVS Protheus Schedule 0 Broker


[healthcheck]
; Validacao final de saude do ambiente apos uma recuperacao.
; method: TCP | HTTP | NONE
enabled = false
method = NONE
host = 127.0.0.1
port = 0
http_url =
timeout_seconds = 10


[smtp]
enabled = false
host = smtp.empresa.com
port = 587
use_tls = true
; username/password: defina via .env (WATCHDOG_SMTP_USERNAME / WATCHDOG_SMTP_PASSWORD).
; Nao coloque a senha aqui - este arquivo e versionado no git.
username =
password =
from_addr = watchdog@empresa.com
; Lista de destinatarios separados por virgula.
to_addrs = ti@empresa.com


[teams]
enabled = true
; URL do fluxo do Power Automate (trigger HTTP) que posta o Adaptive Card no Teams.
; ATENCAO: essa URL contem uma assinatura (sig=...) que funciona como uma credencial
; de acesso ao fluxo. Defina-a via .env (WATCHDOG_TEAMS_WEBHOOK_URL) - nao coloque
; o valor real aqui, pois este arquivo e versionado no git.
webhook_url =


[telegram]
enabled = true
; Token do bot gerado pelo @BotFather (formato "123456789:ABCdef...").
; ATENCAO: o token e uma credencial completa de acesso ao bot. Defina-o via
; .env (WATCHDOG_TELEGRAM_BOT_TOKEN) - nao coloque o valor real aqui, pois
; este arquivo e versionado no git.
bot_token =
; ID do chat/grupo de destino (numero negativo). Grupos "supergroup" usam o
; prefixo -100 (ex.: -1001234567890); grupos basicos usam o numero direto
; (ex.: -1234567890). Pode ser definido aqui ou via .env (WATCHDOG_TELEGRAM_CHAT_ID).
chat_id =


[logging]
log_dir = logs
log_level = INFO
; Rotacao automatica de logs: tamanho maximo (bytes) e quantidade de arquivos mantidos.
max_bytes = 5242880
backup_count = 10


[backup]
backup_dir = backup
; Backups do console.log mais antigos que este numero de dias sao removidos automaticamente.
retention_days = 30


[lock]
status_dir = status
lock_file = status.lock


; ============================================================================
; Overrides por ambiente (opcional)
; ----------------------------------------------------------------------------
; Permite que os mesmos arquivos de configuracao/regra atendam a mais de um
; ambiente. As chaves definidas aqui sobrescrevem as equivalentes das secoes
; [monitor] e [services] quando general.environment = <NOME>.
; ============================================================================

[environment:PRODUCTION]
console_log_path = C:\Workspace\schecule-rebooter\watchdog-dbaccess\data\dbaccess.log
dbaccess_service = TOTVS DBAccess

[environment:HOMOLOGACAO]
console_log_path = C:\Protheus\homologacao\dbaccess\console.log
dbaccess_service = TOTVS DBAccess HOM


; ============================================================================
; Regras de deteccao de erro
; ----------------------------------------------------------------------------
; Cada regra e uma secao "[rule:<id>]" com as seguintes chaves:
;   description   - texto livre exibido em logs e notificacoes.
;   pattern       - expressao regular (aplicada a cada linha do log).
;   severity      - BAIXA | MEDIA | ALTA | CRITICA
;   action        - RESTART_SCHEDULE | RESTART_SERVICE_GROUP | SOMENTE_LOG | NOTIFICAR
;   send_email    - true/false
;   send_teams    - true/false
;   send_telegram - true/false
;   only_log      - true/false (se true, a regra apenas registra, nunca recupera)
;   auto_execute  - true/false (se false, a acao e apenas sugerida no log)
;   services      - (obrigatorio para RESTART_SERVICE_GROUP) lista de servicos
;                   separados por virgula, na ordem de PARADA. A inicializacao
;                   usa automaticamente a ordem inversa desta lista.
;
; Observacao sobre a acao NOTIFICAR: e dedicada a alertas que nao devem gerar
; nenhuma tentativa de recuperacao automatica (ex.: erros de dado, nao de
; conexao/servico). Por isso ela ignora only_log/auto_execute e sempre dispara
; as notificacoes habilitadas (send_email/send_teams), respeitando apenas o
; intervalo minimo entre execucoes (min_recovery_interval_seconds).
; ============================================================================

; ----------------------------------------------------------------------------
; Exemplo de como criar uma NOVA regra (ajuste ou remova conforme a necessidade).
; Essa aqui usa RESTART_SCHEDULE: reinicia somente os servicos configurados em
; [services].schedule_services (nao mexe no DBAccess nem em outros servicos).
; ----------------------------------------------------------------------------
; [rule:schedule_travado]
; description = Schedule travado / sem resposta
; pattern = (?i)schedule.*(trava|n(a|ã)o\s+responde|hang)
; severity = ALTA
; action = RESTART_SCHEDULE
; send_email = false
; send_teams = false
; only_log = false
; auto_execute = true

[rule:dbaccess_connection_lost]
description = Erro 1326: perda de conexao do DBAccess com o SQL Server
pattern = (?i)error\s*:\s*1326\b.*sql\s*server
severity = CRITICA
action = RESTART_SERVICE_GROUP
send_email = false
send_teams = false
only_log = false
auto_execute = true
; Ordem de PARADA (a inicializacao e feita na ordem inversa automaticamente).
services =
    TOTVS_Schedule_8,
    TOTVS_Schedule_7,
    TOTVS_Schedule_6,
    TOTVS_Schedule_5,
    TOTVS_Schedule_4,
    TOTVS_Schedule_3,
    TOTVS_Schedule_2,
    TOTVS_Schedule_1,
    TOTVS_Protheus_Rest_SSL_SmartView,
    TOTVS_Protheus_Rest_SSL_2,
    TOTVS_Protheus_Rest_SSL_1,
    TOTVS_Protheus_Rest_1,
    TOTVS_Protheus_Schedule_Broker,
    TOTVS_Protheus_Rest_WS_Broker_SSL,
    TOTVS_Protheus_Rest_WS_Broker,
    00_TOTVS_DBAccess_Slave

[rule:erro_chave_duplicada]
description = Erro 2601: chave duplicada ao inserir registro (SA1060)
pattern = (?i)error\s*:\s*2601\b.*chave\s*duplicada
severity = MEDIA
action = NOTIFICAR
send_email = false
send_teams = true
send_telegram = true
